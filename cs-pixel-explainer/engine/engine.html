<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
 * cs-pixel-explainer 引擎
 * 输入：window.SPEC（分镜脚本） + window.TL（时间轴，由 timeline.mjs 生成）
 * 输出：window.render(t) 画出第 t 秒的一帧
 * ===================================================================== */
const FW = 1920, FH = 1080, S = 4, W = 480, H = 270;
const M = document.getElementById('c').getContext('2d');
const lowC = document.createElement('canvas'); lowC.width = W; lowC.height = H;
const L = lowC.getContext('2d');
const FONT = '"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace';
const SANS = '"Noto Sans CJK SC","Microsoft YaHei",sans-serif';

// ---------- 工具 ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

const C = {
  cyan: '#46e0ee', red: '#ff4a5e', yellow: '#ffd24a', green: '#5ee07a', purple: '#b07aff',
  white: '#e6e8f2', grey: '#8a8fb0', crowd: '#2c2f4c', skin: '#e8c9a0', dark: '#141626'
};
const colorOf = c => C[c] || c || C.white;

// ---------- 富文本：[y]黄[/y] [r]红[/r] [c]青[/c] [g]绿[/g] ----------
const TAGC = { y: C.yellow, r: C.red, c: C.cyan, g: C.green };
function parseRich(s) {
  const out = []; let col = C.white;
  String(s).split(/(\[\/?[yrcg]\])/).forEach(p => {
    const m = p.match(/^\[(\/?)([yrcg])\]$/);
    if (m) col = m[1] ? C.white : TAGC[m[2]]; else [...p].forEach(ch => out.push([ch, col]));
  });
  return out;
}
const plain = s => String(s).replace(/\[\/?[yrcg]\]/g, '');

// ---------- 像素文字 ----------
const pixCache = new Map();
function pixTextCanvas(str, size, color) {
  const key = str + '|' + size + '|' + color;
  if (pixCache.has(key)) return pixCache.get(key);
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `700 ${size}px ${SANS}`;
  const w = Math.ceil(x.measureText(str).width) + 4, h = Math.ceil(size * 1.4);
  c.width = w; c.height = h;
  x.font = `700 ${size}px ${SANS}`; x.textBaseline = 'middle'; x.fillStyle = color; x.fillText(str, 2, h / 2);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  for (let i = 3; i < p.length; i += 4) p[i] = p[i] > 90 ? 255 : 0;
  x.putImageData(d, 0, 0); pixCache.set(key, c); return c;
}
function pixText(str, cx, cy, size, color, { align = 'center', glow = 0, alpha = 1 } = {}) {
  if (!str || alpha <= 0) return;
  const c = pixTextCanvas(str, size, color), w = c.width * S, h = c.height * S;
  const x = align === 'center' ? cx - w / 2 : align === 'right' ? cx - w : cx;
  M.save(); M.globalAlpha = alpha; M.imageSmoothingEnabled = false;
  if (glow) { M.shadowColor = color; M.shadowBlur = glow; }
  M.drawImage(c, Math.round(x), Math.round(cy - h / 2), w, h); M.restore();
}
// 点阵文字（结尾用）
function dotText(str, cx, cy, size, color, alpha) {
  if (!str || alpha <= 0) return;
  const c = pixTextCanvas(str, size, color), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const cell = 7, w = c.width * cell, h = c.height * cell, x0 = cx - w / 2, y0 = cy - h / 2;
  M.save(); M.globalAlpha = alpha; M.fillStyle = color; M.shadowColor = color; M.shadowBlur = 10;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 0) M.fillRect(x0 + x * cell, y0 + y * cell, cell - 2, cell - 2);
  M.restore();
}
function textAt(str, x, y, size, col, align = 'left', a = 1, font = FONT, weight = 400) {
  if (a <= 0 || !str) return; M.save(); M.globalAlpha = a; M.font = `${weight} ${size}px ${font}`; M.fillStyle = col; M.textAlign = align; M.textBaseline = 'middle'; M.fillText(str, x, y); M.restore();
}
function richAt(str, x, y, size, a = 1, align = 'left') {
  if (a <= 0) return; const parts = parseRich(str);
  M.save(); M.globalAlpha = a; M.font = `400 ${size}px ${FONT}`; M.textBaseline = 'middle';
  const w = parts.reduce((s, [c]) => s + M.measureText(c).width, 0);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  parts.forEach(([c, col]) => { M.fillStyle = col; M.fillText(c, cx, y); cx += M.measureText(c).width; }); M.restore();
}

// ---------- 像素角色 ----------
function drawChar(ctx, x, y, px, o = {}) {
  const { body = C.crowd, hair = '#1c1d30', skin = C.crowd, t = 0, pose = 'stand', dir = 1, speed = 1 } = o;
  const r = (dx, dy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x + dx * px * dir - (dir < 0 ? w * px : 0)), Math.round(y + dy * px), Math.ceil(w * px), Math.ceil(h * px)); };

  const leg = pose === 'stand' || pose === 'arms' ? [0, 0] : pose === 'fall' ? [-1, 1] : [[-1, 1], [0, 0], [1, -1], [0, 0]][ph];
  const lean = pose === 'run' ? 1 : 0, k = pose === 'run' ? 2 : 1;
  r(-1 + leg[0] * k, -5, 1, 5, C.dark); r(1 + leg[1] * k, -5, 1, 5, C.dark);

  if (pose === 'fall' || pose === 'arms') { r(-3, -16, 1, 5, body); r(3, -16, 1, 5, body); }

}
const HERO = { body: C.cyan, hair: '#1a3a4a', skin: C.skin };
const PALETTE = ['#d94a5c', '#e0a040', '#5ec27a', '#6a7ae0', '#c060d0', '#40b0c0', '#e07050'];
function person(i) { return { body: PALETTE[i % PALETTE.length], hair: i % 2 ? '#e8a040' : '#2a1a1a', skin: C.skin }; }
function drawHeart(x, y, px, col) { const m = ['.x.x.', 'xxxxx', 'xxxxx', '.xxx.', '..x..']; M.fillStyle = col; m.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'x') M.fillRect(Math.round(x + (i - 2) * px), Math.round(y + (j - 2) * px), px, px); })); }
function drawGift(x, y, px) { M.fillStyle = '#ff9a3a'; M.fillRect(x - 2 * px, y - 2 * px, 5 * px, 4 * px); M.fillStyle = '#ffe07a'; M.fillRect(x, y - 2 * px, px, 4 * px); M.fillRect(x - 2 * px, y - px, 5 * px, px); }
function drawTower(x, y, px, a, col = C.yellow) {
  M.save(); M.globalAlpha = a; M.shadowColor = col; M.shadowBlur = 20;
  M.fillStyle = '#c89a32'; M.fillRect(x - 2.5 * px, y - 11 * px, 5 * px, 11 * px);
  M.fillStyle = col; M.fillRect(x - .5 * px, y - 15 * px, px, 4 * px); M.fillRect(x - 1.5 * px, y - 12 * px, 3 * px, px);
  M.fillStyle = '#fff2a0'; [[-1, -9], [1, -9], [-1, -6], [1, -6], [-1, -3], [1, -3]].forEach(([dx, dy]) => M.fillRect(x + (dx - .5) * px, y + dy * px, px, px * 1.5));
  M.restore();
}
const MARKS = {
  '✓': ['.......x', '......xx', '.....xx.', 'x...xx..', 'xx.xx...', '.xxx....', '..x.....'],
  '✗': ['x.....x', 'xx...xx', '.xx.xx.', '..xxx..', '.xx.xx.', 'xx...xx', 'x.....x'],
  '?': ['.xxxx.', 'xx..xx', '....xx', '...xx.', '..xx..', '......', '..xx..']
};
function mark(sym, x, y, size, a = 1) {
  const m = MARKS[sym] || MARKS['?'], col = sym === '✓' ? C.green : sym === '✗' ? C.red : C.yellow, px = Math.round(size / 2.2);
  M.save(); M.globalAlpha = a; M.fillStyle = col; M.shadowColor = col; M.shadowBlur = 14;
  const x0 = x - m[0].length * px / 2, y0 = y - m.length * px / 2;
  m.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'x') M.fillRect(Math.round(x0 + i * px), Math.round(y0 + j * px), px, px); }));
  M.restore();
}
// ---------- 发光 / 线 ----------
function glow(x, y, r, rgb, a) {

  const g = M.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  M.fillStyle = g; M.fillRect(x - r, y - r, r * 2, r * 2); M.restore();
}
function line(x0, y0, x1, y1, col, w = 2, k = 1, dash = null, blur = 0) {
  if (k <= 0) return; M.save(); if (dash) M.setLineDash(dash); M.strokeStyle = col; M.lineWidth = w; if (blur) { M.shadowColor = col; M.shadowBlur = blur; }
  M.beginPath(); M.moveTo(x0, y0); M.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); M.stroke(); M.restore();
}
function arrowV(x, y0, y1, col, k) {
  if (k <= 0) return; const y = lerp(y0, y1, k), d = Math.sign(y1 - y0);
  line(x, y0, x, y, col, 4, 1, null, 12);
  M.save(); M.fillStyle = col; M.beginPath(); M.moveTo(x - 12, y - d * 16); M.lineTo(x, y + d * 2); M.lineTo(x + 12, y - d * 16); M.fill(); M.restore();
}
function box(x, y, w, h, a = 1, border = '#3a4068', bg = 'rgba(8,10,24,.78)') {
  M.save(); M.globalAlpha = a; M.fillStyle = bg; M.fillRect(x, y, w, h); M.strokeStyle = border; M.lineWidth = 2; M.strokeRect(x, y, w, h); M.restore();
}
function embers(cx, cy, spread, t, n, rgb = '255,120,60') {
  for (let i = 0; i < n; i++) { const x = cx + (hash(i) - .5) * spread, y = cy - ((t * (30 + hash(i + 1) * 50) + hash(i + 3) * 400) % 400); M.fillStyle = `rgba(${rgb},${.25 + hash(i + 2) * .5})`; M.fillRect(x | 0, y | 0, 4, 4); }
}
function bgDark(tint = '20,22,50') {
  M.fillStyle = '#07080f'; M.fillRect(0, 0, FW, FH);
  const g = M.createRadialGradient(960, 540, 100, 960, 540, 1100); g.addColorStop(0, `rgba(${tint},.55)`); g.addColorStop(1, 'rgba(0,0,0,0)'); M.fillStyle = g; M.fillRect(0, 0, FW, FH);
}
function bgChecker(t) {
  M.fillStyle = '#0d0a1c'; M.fillRect(0, 0, FW, FH); M.fillStyle = '#120e26';
  for (let y = 0; y < FH; y += 48) for (let x = ((y / 48) % 2) * 48; x < FW; x += 96) M.fillRect(x, y, 48, 48);
}
// 平台（人物脚下的小椭圆）
function platform(x, y, w, col = '#2a2e4c') { M.save(); M.fillStyle = col; M.beginPath(); M.ellipse(x, y + 4, w, 10, 0, 0, 7); M.fill(); M.restore(); }

// =====================================================================
// 场景：street（夜晚街道叙事）
// =====================================================================
const GROUND = 196;
const city = (() => { const R = rng(7), a = []; let x = -10; while (x < W + 20) { const w = 14 + R() * 26; a.push({ x, w, h: 40 + R() * 110, layer: R() < .5 ? 0 : 1, win: R() }); x += w + R() * 6; } return a; })();
const stars = (() => { const R = rng(3); return Array.from({ length: 60 }, () => ({ x: R() * W, y: R() * 150, p: R() })); })();
const LAMPS = [30, 110, 190, 270, 350, 430];
const crowdP = (() => { const R = rng(11); return Array.from({ length: 12 }, () => ({ x0: R() * 520, v: (R() < .5 ? -1 : 1) * (7 + R() * 7) })); })();

function drawStreetBG(t, holeX, hole) {
  const g = L.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, '#07091a'); g.addColorStop(1, '#1b1c3e');
  L.fillStyle = g; L.fillRect(0, 0, W, GROUND);
  stars.forEach(s => { if (Math.sin(t * 2 + s.p * 20) > -.4) { L.fillStyle = '#5a5e96'; L.fillRect(s.x | 0, s.y | 0, 1, 1); } });
  L.fillStyle = '#6d6ed6'; L.beginPath(); L.arc(440, 38, 10, 0, 7); L.fill(); L.fillStyle = '#9294f0'; L.beginPath(); L.arc(437, 36, 8, 0, 7); L.fill();
  city.forEach(b => {
    L.fillStyle = b.layer ? '#1d2040' : '#141734'; const top = GROUND - b.h * (b.layer ? .8 : 1);
    L.fillRect(b.x | 0, top | 0, b.w | 0, GROUND - top);
    if (b.win > .4) for (let yy = top + 5; yy < GROUND - 8; yy += 7) for (let xx = b.x + 3; xx < b.x + b.w - 3; xx += 5) if (hash(xx * 3 + yy) > .82) { L.fillStyle = '#3a3448'; L.fillRect(xx | 0, yy | 0, 1, 2); }
  });
  LAMPS.forEach(x => { L.fillStyle = '#262946'; L.fillRect(x, GROUND - 28, 1, 28); L.fillStyle = '#ffcf5a'; L.fillRect(x - 1, GROUND - 30, 3, 2); });
  L.fillStyle = '#2f3354'; L.fillRect(0, GROUND, W, 1); L.fillStyle = '#20233e'; L.fillRect(0, GROUND + 1, W, 4);
  L.fillStyle = '#191b33'; L.fillRect(0, GROUND + 5, W, H - GROUND); L.fillStyle = '#12142a';
  for (let row = 0; row < 15; row++) { const yy = GROUND + 5 + row * 5; L.fillRect(0, yy, W, 1); for (let xx = (row % 2) * 5; xx < W; xx += 10) L.fillRect(xx, yy, 1, 5); }
  if (hole > 0) { L.fillStyle = '#0c0714'; for (let yy = GROUND; yy < H; yy++) { const w = hole * (1 + (yy - GROUND) * .01) + (hash(yy) - .5) * 4; L.fillRect(holeX - w / 2, yy, w, 1); } }
}
function streetGlows(t) {
  glow(440 * S, 38 * S, 130, '120,120,255', .35);
  LAMPS.forEach(x => glow(x * S + 2, (GROUND - 29) * S, 55, '255,200,90', .3));
  glow(960, (GROUND - 40) * S, 1100, '70,60,160', .22);
  for (let i = 0; i < 26; i++) { const x = (hash(i) * W + t * (3 + hash(i + 9) * 5)) % W, y = hash(i + 3) * 170 + Math.sin(t + i) * 4; M.fillStyle = `rgba(255,210,110,${.25 + .35 * hash(i + 5)})`; M.fillRect(x * S, y * S, 4, 4); }
}
// 根据事件预计算主角的运动轨迹
function heroPlan(sc) {
  if (sc._plan) return sc._plan;
  const p = sc.props || {}, evs = sc._events;
  const npcX = p.npc ? (p.npc.x ?? 330) : 330;
  let x = p.heroX ?? 150, tt = 0; const segs = [];
  let walkV = p.heroWalk === false ? 0 : 5;
  evs.forEach(e => {
    if (!['run', 'reject', 'walk', 'collapse'].includes(e.do)) return;
    const x1 = x + walkV * (e.t - tt); segs.push({ t0: tt, t1: e.t, x0: x, x1, pose: walkV ? 'walk' : 'stand' }); x = x1;
    if (e.do === 'run') { const tx = e.to ?? npcX - 40; segs.push({ t0: e.t, t1: e.t + 1.3, x0: x, x1: tx, pose: 'run', ease: 1 }); x = tx; tt = e.t + 1.3; walkV = 0; }
    else if (e.do === 'walk') { const tx = e.to ?? x + 60; segs.push({ t0: e.t, t1: e.t + 2, x0: x, x1: tx, pose: 'walk' }); x = tx; tt = e.t + 2; }

    else if (e.do === 'collapse') { segs.push({ t0: e.t, t1: 999, x0: x, x1: x, pose: 'fall', fallAt: e.t + .15 }); tt = 999; }

function sceneStreet(sc, lt) {

    if (e.do === 'bubble') { const a = seg(d, 0, .15) * (1 - seg(d, e.dur ?? 2.2, (e.dur ?? 2.2) + .3)); const who = e.who === 'npc' ? [gx, gy] : e.who === 'hero' ? [hx, hy] : [(hero.x + 26 + (e.who || 0) * 22) * S, gy]; bubble(e.text, who[0], who[1] - 90, a); }

// =====================================================================
// HUD（跨场景的“坐标”面板）
// =====================================================================

  textAt(h.bottom || '敌', X + Wd - 52, Y + Hd - 62, 32, C.red, 'center'); M.fillStyle = C.red; M.fillRect(X + Wd - 32, Y + Hd - 66, 6, 6);

// =====================================================================
// 字幕（打字机）
// =====================================================================
function drawSubs(t) {

  const ln = TL.lines.find(l => t >= l.start && t < l.end + .25); if (!ln || !ln.text) return;
  const chars = parseRich(ln.text), dur = ln.end - ln.start;
  const speed = Math.max(9, chars.length / Math.max(.6, dur * .75));
  const n = Math.min(chars.length, Math.floor((t - ln.start) * speed) + 1), typing = n < chars.length;
  M.save(); M.font = `400 42px ${FONT}`; M.textBaseline = 'middle';
  const fullW = chars.reduce((w, [c]) => w + M.measureText(c).width, 0), bw = fullW + 60, bx = 960 - bw / 2, by = 950, bh = 76;
  const a = seg(t, ln.start, ln.start + .1) * (1 - seg(t, ln.end + .1, ln.end + .25));
  M.globalAlpha = a; M.fillStyle = 'rgba(10,12,26,.86)'; M.fillRect(bx, by, bw, bh); M.fillStyle = '#34406e'; M.fillRect(bx, by, 5, bh);
  let x = bx + 28;

// =====================================================================
// 后期：点阵纹理、暗角、转场

let dotPattern;

  M.fillStyle = dotPattern; M.fillRect(0, 0, FW, FH);
  const v = M.createRadialGradient(960, 540, 400, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); M.fillStyle = v; M.fillRect(0, 0, FW, FH);
  const f = Math.max(1 - seg(t, 0, .5), seg(t, TL.total - .6, TL.total)); if (f > 0) { M.fillStyle = `rgba(0,0,0,${f})`; M.fillRect(0, 0, FW, FH); }

// =====================================================================
// 主入口
// =====================================================================
const SCENES = { street: sceneStreet, abyss: sceneAbyss, axes: sceneAxes, slot: sceneSlot, card: sceneCard, network: sceneNetwork, triangle: sceneTriangle, bigtext: sceneBigtext };

// 把“行锚点”（如 1.5 = 本场景第 2 句念到一半）换算成场景内秒数
function prepare() {

    const s = TL.scenes[si], lines = TL.lines.filter(l => l.scene === si);
    const at = v => { if (v == null) return 0; const i = Math.floor(v), f = v - i; const l = lines[Math.min(i, lines.length - 1)]; if (!l) return 0; return (i >= lines.length ? l.end : l.start + f * (l.end - l.start)) - s.start; };

    const p = sc.props || {};

    const b = p.body || {};
    (b.rows || []).forEach(r => { if (r.at != null) r._t = at(r.at); });
    (b.cols || []).forEach(r => { if (r.at != null) r._t = at(r.at); });
    (b.quotes || []).forEach(r => { if (r.at != null) r._t = at(r.at); });
    if (b.verdictAt != null) b._vt = at(b.verdictAt); if (b.meterAt != null) b._mt = at(b.meterAt);
    if (p.landAt != null && typeof p.landAt === 'number' && p.landAtLine) p.landAt = at(p.landAt);
    if (p.labelAtLine != null) p.labelAt = at(p.labelAtLine);
    (sc.hud || []).forEach(([a, x, y]) => TL._hud.push([s.start + at(a), x, y]));

}
function render(t) {

  const si = Math.max(0, TL.scenes.findIndex(s => t >= s.start && t < s.end)), sc = SPEC.scenes[si], s = TL.scenes[si];
  const lt = t - s.start;

window.boot = (spec, tl) => { window.SPEC = spec; window.TL = tl; prepare(); render(0); return tl.total; };
window.render = render;
