name: 校验规则与案例
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_framework.py
      - run: python scripts/test_candidates.py
      - run: python scripts/test_framework.py
      - run: python scripts/test_resource_paths.py
