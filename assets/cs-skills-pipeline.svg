<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">CS Skills 工作流</title>
  <desc id="desc">目标与素材进入 cs-run，选择一个专项 Skill 执行，验证结果，再按需发布到 GitHub 或部署。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#15242a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <text x="32" y="42" fill="#91aaa9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Noto Sans SC, sans-serif" font-size="17" letter-spacing="1">CS SKILLS · 从目标到可验证交付</text>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Noto Sans SC, sans-serif">
    <g fill="#101d23" stroke="#345356" stroke-width="1.5">
      <rect x="32" y="76" width="192" height="132" rx="16"/>
      <rect x="268" y="76" width="192" height="132" rx="16"/>
      <rect x="504" y="76" width="192" height="132" rx="16"/>
      <rect x="740" y="76" width="192" height="132" rx="16"/>
      <rect x="976" y="76" width="192" height="132" rx="16"/>
    </g>
    <g text-anchor="middle">
      <text x="128" y="128" fill="#f1f5f3" font-size="24" font-weight="700">目标与素材</text>
      <text x="128" y="165" fill="#9eb8b6" font-size="16">说清要完成什么</text>
      <text x="364" y="128" fill="#8de0cd" font-size="24" font-weight="700">cs-run</text>
      <text x="364" y="165" fill="#9eb8b6" font-size="16">选择一个主 Skill</text>
      <text x="600" y="128" fill="#f1f5f3" font-size="24" font-weight="700">专项执行</text>
      <text x="600" y="165" fill="#9eb8b6" font-size="16">产品 · 内容 · 视频</text>
      <text x="836" y="128" fill="#f1f5f3" font-size="24" font-weight="700">验证结果</text>
      <text x="836" y="165" fill="#9eb8b6" font-size="16">检查真实产物</text>
      <text x="1072" y="128" fill="#f4d796" font-size="24" font-weight="700">按需发布</text>
      <text x="1072" y="165" fill="#9eb8b6" font-size="16">GitHub / 部署</text>
    </g>
    <g fill="#77c7b8" font-size="28" text-anchor="middle">
      <text x="246" y="154">→</text>
      <text x="482" y="154">→</text>
      <text x="718" y="154">→</text>
      <text x="954" y="154">→</text>
    </g>
  </g>
</svg>
