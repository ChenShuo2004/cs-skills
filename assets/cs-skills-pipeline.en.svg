<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">CS Skills workflow</title>
  <desc id="desc">A goal enters cs-run, a specialist Skill executes, the result is verified, and the work is published if needed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#15242a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <text x="32" y="42" fill="#91aaa9" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="17" letter-spacing="1">CS SKILLS · FROM GOAL TO VERIFIED OUTPUT</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">
    <g fill="#101d23" stroke="#345356" stroke-width="1.5">
      <rect x="32" y="76" width="192" height="132" rx="16"/>
      <rect x="268" y="76" width="192" height="132" rx="16"/>
      <rect x="504" y="76" width="192" height="132" rx="16"/>
      <rect x="740" y="76" width="192" height="132" rx="16"/>
      <rect x="976" y="76" width="192" height="132" rx="16"/>
    </g>
    <g text-anchor="middle">
      <text x="128" y="128" fill="#f1f5f3" font-size="22" font-weight="700">Goal &amp; inputs</text>
      <text x="128" y="165" fill="#9eb8b6" font-size="16">Define the task</text>
      <text x="364" y="128" fill="#8de0cd" font-size="24" font-weight="700">cs-run</text>
      <text x="364" y="165" fill="#9eb8b6" font-size="16">Pick one Skill</text>
      <text x="600" y="128" fill="#f1f5f3" font-size="24" font-weight="700">Specialist</text>
      <text x="600" y="165" fill="#9eb8b6" font-size="16">Build · write · film</text>
      <text x="836" y="128" fill="#f1f5f3" font-size="24" font-weight="700">Verify</text>
      <text x="836" y="165" fill="#9eb8b6" font-size="16">Inspect the result</text>
      <text x="1072" y="128" fill="#f4d796" font-size="24" font-weight="700">Publish</text>
      <text x="1072" y="165" fill="#9eb8b6" font-size="16">GitHub / deploy</text>
    </g>
    <g fill="#77c7b8" font-size="28" text-anchor="middle">
      <text x="246" y="154">→</text>
      <text x="482" y="154">→</text>
      <text x="718" y="154">→</text>
      <text x="954" y="154">→</text>
    </g>
  </g>
</svg>
